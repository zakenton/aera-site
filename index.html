<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aera</title>
<meta name="description" content="Aera — a personal, on-device music player for iPhone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F3EB;
    --text: #1A1712;
    --text-dim: rgba(26, 23, 18, 0.62);
    --card: rgba(253, 250, 243, 0.72);
    --card-border: rgba(26, 23, 18, 0.10);
    --glow: rgba(0, 0, 0, 0.40);
    --glow-soft: rgba(0, 0, 0, 0.18);
    --eq-bar: rgba(0, 0, 0, 0.55);
    --shadow: rgba(26, 23, 18, 0.14);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --text: #FFFFFF;
      --text-dim: rgba(255, 255, 255, 0.62);
      --card: rgba(28, 28, 30, 0.68);
      --card-border: rgba(255, 255, 255, 0.12);
      --glow: rgba(255, 255, 255, 0.45);
      --glow-soft: rgba(255, 255, 255, 0.20);
      --eq-bar: rgba(255, 255, 255, 0.55);
      --shadow: rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --text: #FFFFFF;
    --text-dim: rgba(255, 255, 255, 0.62);
    --card: rgba(28, 28, 30, 0.68);
    --card-border: rgba(255, 255, 255, 0.12);
    --glow: rgba(255, 255, 255, 0.45);
    --glow-soft: rgba(255, 255, 255, 0.20);
    --eq-bar: rgba(255, 255, 255, 0.55);
    --shadow: rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    transition: background-color .3s ease, color .3s ease;
  }

  /* ---------- Top bar ---------- */

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(16px, env(safe-area-inset-top)) 18px 0;
  }

  .topbar-group {
    display: flex;
    gap: 10px;
  }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 2px 10px var(--shadow);
    transition: transform .18s ease, background-color .3s ease, border-color .3s ease;
  }

  .icon-btn:hover { transform: translateY(-2px) scale(1.04); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 19px; height: 19px; display: block; }

  #theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] #theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] #theme-toggle .icon-moon { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #theme-toggle .icon-sun { display: none; }
    :root:not([data-theme="light"]) #theme-toggle .icon-moon { display: block; }
  }

  /* ---------- Hero ---------- */

  .hero {
    position: relative;
    z-index: 1;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    transform: translateY(-7svh);
  }

  .logo {
    margin: 0;
    font-family: ui-rounded, "SF Pro Rounded", "Fredoka", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(3.4rem, 11vw, 12rem);
    letter-spacing: -0.01em;
    line-height: 1;
    color: var(--text);
    text-shadow:
      0 0 18px var(--glow),
      0 0 46px var(--glow-soft),
      0 0 90px var(--glow-soft);
  }

  .subtitle {
    margin: 18px 0 0;
    font-size: clamp(1rem, 1.6vw, 1.5rem);
    color: var(--text-dim);
    max-width: 44ch;
  }

  /* ---------- TestFlight banner ---------- */

  .testflight {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px 10px 12px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    box-shadow: 0 8px 30px var(--shadow);
    text-decoration: none;
    color: var(--text);
    max-width: calc(100vw - 32px);
    transition: transform .2s ease, background-color .3s ease, border-color .3s ease;
  }

  .testflight:hover { transform: translateX(-50%) translateY(-2px); }
  .testflight:active { transform: translateX(-50%) scale(0.98); }

  .tf-icon {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #0A84FF, #6E5CE6);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tf-icon svg { width: 18px; height: 18px; }

  .tf-text {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
  }
  .tf-text strong { font-size: 0.92rem; font-weight: 600; }
  .tf-text span { font-size: 0.78rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; }

  .tf-arrow {
    flex: none;
    opacity: 0.5;
    font-size: 1.1rem;
    transform: translateY(-1px);
  }

  /* ---------- Equalizer glow ---------- */

  .eq-glow {
    position: fixed;
    left: 0;
    right: 0;
    bottom: -60px;
    height: 46vh;
    z-index: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(6px, 1.2vw, 22px);
    padding: 0;
    filter: blur(28px);
    opacity: 0.6;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to top, black, transparent 85%);
    mask-image: linear-gradient(to top, black, transparent 85%);
  }

  .eq-glow span {
    flex: 1 1 auto;
    border-radius: 12px;
    background: var(--eq-bar);
    animation: eq-bounce 2.6s ease-in-out infinite;
  }

  @media (max-width: 700px) {
    .eq-glow { padding: 0 6vw; }
    .eq-glow span { max-width: 26px; }
  }

  @keyframes eq-bounce {
    0%, 100% { height: 14%; }
    50% { height: 78%; }
  }

  .eq-glow span:nth-child(1)  { height: 30%; animation-duration: 2.1s; animation-delay: -0.1s; }
  .eq-glow span:nth-child(2)  { height: 55%; animation-duration: 2.8s; animation-delay: -1.4s; }
  .eq-glow span:nth-child(3)  { height: 20%; animation-duration: 2.3s; animation-delay: -0.6s; }
  .eq-glow span:nth-child(4)  { height: 68%; animation-duration: 3.1s; animation-delay: -2.0s; }
  .eq-glow span:nth-child(5)  { height: 40%; animation-duration: 2.5s; animation-delay: -0.3s; }
  .eq-glow span:nth-child(6)  { height: 75%; animation-duration: 2.9s; animation-delay: -1.1s; }
  .eq-glow span:nth-child(7)  { height: 25%; animation-duration: 2.2s; animation-delay: -1.8s; }
  .eq-glow span:nth-child(8)  { height: 60%; animation-duration: 3.3s; animation-delay: -0.8s; }
  .eq-glow span:nth-child(9)  { height: 35%; animation-duration: 2.6s; animation-delay: -2.3s; }
  .eq-glow span:nth-child(10) { height: 70%; animation-duration: 2.4s; animation-delay: -1.6s; }
  .eq-glow span:nth-child(11) { height: 22%; animation-duration: 3.0s; animation-delay: -0.4s; }
  .eq-glow span:nth-child(12) { height: 52%; animation-duration: 2.7s; animation-delay: -2.1s; }
  .eq-glow span:nth-child(13) { height: 32%; animation-duration: 2.9s; animation-delay: -1.9s; }
  .eq-glow span:nth-child(14) { height: 64%; animation-duration: 2.3s; animation-delay: -0.7s; }
  .eq-glow span:nth-child(15) { height: 24%; animation-duration: 3.2s; animation-delay: -2.5s; }
  .eq-glow span:nth-child(16) { height: 58%; animation-duration: 2.6s; animation-delay: -1.2s; }
  .eq-glow span:nth-child(17) { height: 38%; animation-duration: 2.4s; animation-delay: -0.2s; }
  .eq-glow span:nth-child(18) { height: 72%; animation-duration: 3.0s; animation-delay: -1.7s; }
  .eq-glow span:nth-child(19) { height: 28%; animation-duration: 2.7s; animation-delay: -2.8s; }
  .eq-glow span:nth-child(20) { height: 48%; animation-duration: 2.2s; animation-delay: -0.9s; }

  @media (max-width: 480px) {
    .eq-glow span:nth-child(n+9) { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .eq-glow span { animation: none; height: 40% !important; }
  }
</style>
</head>
<body>

  <div class="eq-glow" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span>
  </div>

  <header class="topbar">
    <div class="topbar-group">
      <a class="icon-btn" href="https://github.com/zakenton" target="_blank" rel="noopener" data-i18n-aria="nav_github" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.58.23 2.75.11 3.04.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .3.2.66.79.55A10.53 10.53 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/></svg>
      </a>
    </div>
    <div class="topbar-group">
      <a class="icon-btn" href="privacy.html" data-i18n-aria="nav_privacy" aria-label="Privacy Policy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3Z"/></svg>
      </a>
      <a class="icon-btn" href="support.html" data-i18n-aria="nav_support" aria-label="Support">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/><path d="M6.3 6.3l3.3 3.3M17.7 6.3l-3.3 3.3M6.3 17.7l3.3-3.3M17.7 17.7l-3.3-3.3"/></svg>
      </a>
      <button class="icon-btn" id="theme-toggle" type="button" data-i18n-aria="nav_theme" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M21.5 12h-2.4M4.9 12H2.5M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3 5.6 5.6"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.7A8.5 8.5 0 0 1 9.3 3.5a8.7 8.7 0 1 0 11.2 11.2Z"/></svg>
      </button>
    </div>
  </header>

  <main class="hero">
    <h1 class="logo">Aera</h1>
    <p class="subtitle" data-i18n="subtitle">A personal, on-device music player.</p>
  </main>

  <a class="testflight" id="testflight-link" href="#" data-i18n-aria="tf_aria" aria-label="Join the TestFlight beta">
    <span class="tf-icon">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 11.5 21 4l-6.5 18-3-8-8.5-2.5Z" fill="#fff"/><path d="M11.5 13.5 21 4" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg>
    </span>
    <span class="tf-text">
      <strong data-i18n="tf_title">Try the beta</strong>
      <span data-i18n="tf_body">Early access via TestFlight</span>
    </span>
    <span class="tf-arrow">›</span>
  </a>

<script>
(function () {
  "use strict";

  var STRINGS = {
    en: {
      subtitle: "A personal, on-device music player.",
      nav_github: "GitHub",
      nav_privacy: "Privacy Policy",
      nav_support: "Support",
      nav_theme: "Toggle theme",
      tf_title: "Try the beta",
      tf_body: "Early access via TestFlight",
      tf_aria: "Join the TestFlight beta"
    },
    ru: {
      subtitle: "Личный музыкальный плеер, который хранит всё на устройстве.",
      nav_github: "GitHub",
      nav_privacy: "Политика конфиденциальности",
      nav_support: "Поддержка",
      nav_theme: "Сменить тему",
      tf_title: "Попробуйте бету",
      tf_body: "Ранний доступ через TestFlight",
      tf_aria: "Присоединиться к бете в TestFlight"
    },
    be: {
      subtitle: "Асабісты музычны плэер, які захоўвае ўсё на прыладзе.",
      nav_github: "GitHub",
      nav_privacy: "Палітыка канфідэнцыйнасці",
      nav_support: "Падтрымка",
      nav_theme: "Змяніць тэму",
      tf_title: "Паспрабуйце бэту",
      tf_body: "Ранні доступ праз TestFlight",
      tf_aria: "Далучыцца да бэты ў TestFlight"
    },
    uk: {
      subtitle: "Особистий музичний плеєр, який зберігає все на пристрої.",
      nav_github: "GitHub",
      nav_privacy: "Політика конфіденційності",
      nav_support: "Підтримка",
      nav_theme: "Змінити тему",
      tf_title: "Спробуйте бету",
      tf_body: "Ранній доступ через TestFlight",
      tf_aria: "Приєднатися до бети в TestFlight"
    },
    bg: {
      subtitle: "Личен музикален плейър, който съхранява всичко на устройството.",
      nav_github: "GitHub",
      nav_privacy: "Политика за поверителност",
      nav_support: "Поддръжка",
      nav_theme: "Смяна на темата",
      tf_title: "Изпробвайте бетата",
      tf_body: "Ранен достъп чрез TestFlight",
      tf_aria: "Присъединете се към бетата в TestFlight"
    },
    de: {
      subtitle: "Ein persönlicher Musikplayer, der alles auf dem Gerät speichert.",
      nav_github: "GitHub",
      nav_privacy: "Datenschutzrichtlinie",
      nav_support: "Support",
      nav_theme: "Design wechseln",
      tf_title: "Beta testen",
      tf_body: "Früher Zugriff über TestFlight",
      tf_aria: "Der TestFlight-Beta beitreten"
    }
  };

  function detectLocale() {
    var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < langs.length; i++) {
      var code = String(langs[i]).slice(0, 2).toLowerCase();
      if (STRINGS[code]) return code;
    }
    return "en";
  }

  var locale = detectLocale();
  var dict = STRINGS[locale];
  document.documentElement.setAttribute("lang", locale);

  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    var key = el.getAttribute("data-i18n");
    if (dict[key]) el.textContent = dict[key];
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
    var key = el.getAttribute("data-i18n-aria");
    if (dict[key]) el.setAttribute("aria-label", dict[key]);
  });

  // ---- Theme toggle ----
  var root = document.documentElement;
  var stored = null;
  try { stored = localStorage.getItem("aera-theme"); } catch (e) {}
  if (stored === "light" || stored === "dark") root.setAttribute("data-theme", stored);

  document.getElementById("theme-toggle").addEventListener("click", function () {
    var current = root.getAttribute("data-theme");
    if (!current) {
      current = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    var next = current === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("aera-theme", next); } catch (e) {}
  });

  // TODO: replace "#" with the public TestFlight link once external testing is live.
})();
</script>
</body>
</html>
